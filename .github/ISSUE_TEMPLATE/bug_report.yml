name: Bug report
description: Report a reproducible problem in GenStudio.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include private media, local paths, tokens, Apple signing material, model weights, or any other secret."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behaviour and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Safe reproduction steps
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Mac model/chip, Xcode version, and GenStudio commit or release.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove private paths, media, tokens, and model identifiers before attaching.
